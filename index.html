<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b2a6b"><meta name="mobile-web-app-capable" content="yes">
<title>Home Budget</title>
<style>
:root{color-scheme:light dark;--bg:#f7f8fb;--tx:#16203f;--mut:#667089;--ink:#1b2a6b;--on:#fff;--rule:#d9dde8;--bad:#b4341c;--ok:#1f7a4d}
@media(prefers-color-scheme:dark){:root{--bg:#10142a;--tx:#e8ebf7;--mut:#8f98b8;--ink:#9fb0ff;--on:#10142a;--rule:#2a3157;--bad:#ff8b6b;--ok:#5fd39a}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:520px;margin:0 auto;padding:16px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mut{color:var(--mut);font-size:14px}.bad{color:var(--bad)}
button{font:inherit;border:0;border-radius:8px;padding:12px 16px;background:var(--ink);color:var(--on);font-weight:600}
button.ghost{background:none;color:var(--ink);padding:8px}button:disabled{opacity:.5}
input,select{font:inherit;width:100%;padding:12px;border:1px solid var(--rule);border-radius:8px;background:transparent;color:var(--tx);margin:6px 0}
.big{font:700 40px/1.1 Georgia,serif;margin:14px 0 6px;color:var(--ink)}.big small{font:14px system-ui;color:var(--mut)}
.pills{display:flex;gap:8px;margin-bottom:12px}.pills span{border:1px solid var(--rule);border-radius:99px;padding:4px 12px;font-size:14px}
nav{display:flex;border-bottom:2px solid var(--rule);margin-bottom:4px}
nav button{flex:1;background:none;color:var(--mut);border-radius:0;padding:10px;text-transform:capitalize;border-bottom:3px solid transparent;margin-bottom:-2px}
nav button.on{color:var(--ink);border-color:var(--ink)}
.it{padding:12px 0;border-bottom:1px solid var(--rule);cursor:pointer}
.it .name{font-weight:600}.it .left{font:600 18px Georgia,serif}
.bar{height:3px;background:var(--rule);margin-top:8px}.bar i{display:block;height:100%;background:var(--ink)}.bar i.bad{background:var(--bad)}
.tag{font-size:12px;color:var(--mut);border:1px solid var(--rule);border-radius:4px;padding:0 6px;margin-left:8px;font-weight:400}
#sheet{position:fixed;inset:0;background:rgba(10,14,40,.5);z-index:5}
#sh{position:absolute;left:0;right:0;bottom:0;background:var(--bg);padding:20px 16px calc(20px + env(safe-area-inset-bottom));border-radius:16px 16px 0 0;max-width:520px;margin:0 auto}
#sh h3{margin:0}#sh .row button{flex:1}
.erow{display:grid;grid-template-columns:1fr 84px 76px 36px;gap:6px;align-items:center}.erow input,.erow select{margin:3px 0;padding:10px 8px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--on);padding:10px 16px;border-radius:99px;z-index:9}
h3.s{margin:22px 0 6px}
.panel{padding:16px 0;border-bottom:1px solid var(--rule)}.panel h4{margin:0 0 8px;font:600 16px system-ui}
.days{display:flex;align-items:flex-end;gap:2px;height:70px;border-bottom:1px solid var(--rule)}.days i{flex:1;background:var(--ink);min-height:2px}
.hd{display:flex;justify-content:space-between;width:100%;background:none;color:var(--tx);border-radius:0;border-bottom:1px solid var(--rule);padding:14px 0;text-align:left}
.ent{padding:8px 0 8px 18px;border-bottom:1px solid var(--rule)}.ent .row{margin-bottom:2px}
</style></head><body><main>
<section id="login" hidden>
  <div class="big" style="margin-top:60px">Home budget</div>
  <p class="mut">Sign in with your name and PIN.</p>
  <input id="u" placeholder="Username" autocapitalize="none" autocomplete="username">
  <input id="p" type="password" inputmode="numeric" placeholder="PIN" autocomplete="current-password" onkeydown="event.key=='Enter'&&login()">
  <p id="err" class="bad"></p><button onclick="login()" style="width:100%">Sign in</button>
</section>
<section id="app" hidden><div id="top"></div><nav id="tabs"></nav><div id="view"></div></section>
</main>
<div id="sheet" hidden onclick="if(event.target===this)closeS()"><div id="sh"></div></div>
<div id="toast" hidden></div>
<script>
const API='https://script.google.com/macros/s/AKfycbyTwClROcbjX6TnExE0Bmoov4RpZjXgJr72OYmz32IH0DR7WZ6CGxahVQtq-R41JrF_/exec';
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f=n=>'₹'+Number(n).toLocaleString('en-IN');
let S=Object.assign({tab:'items',items:[],recent:[]},JSON.parse(localStorage.getItem('hbs')||'{}'),JSON.parse(localStorage.getItem('hb')||'{}'));
let EVQ=[],chain=Promise.resolve(),pend=0;
const track=d=>EVQ.push({d,t:new Date().toISOString()});
const queue=fn=>{pend++;const p=chain.then(fn);chain=p.catch(()=>{});return p.finally(()=>{pend--})};
function resync(){queue(()=>api('state')).then(j=>{if(!pend)upd(j)}).catch(()=>{})}
async function api(action,d={}){
  const ev=EVQ.splice(0);let j;
  try{const r=await fetch(API,{method:'POST',keepalive:true,body:JSON.stringify({action,token:S.token,ev,...d})});j=await r.json()}catch(e){EVQ.unshift(...ev);throw new Error('Network problem. Try again.')}
  if(j.error==='AUTH'){logout();throw new Error('Session expired. Sign in again.')}
  if(j.error)throw new Error(j.error);return j}
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2200)}
function upd(j){Object.assign(S,{items:j.items,recent:j.recent,month:j.month,role:j.role,byUser:j.byUser,daily:j.daily,day:j.day,dim:j.dim});S.rep={};snap();draw()}
function snap(){try{localStorage.setItem('hbs',JSON.stringify({items:S.items,recent:S.recent,month:S.month,byUser:S.byUser,daily:S.daily,day:S.day,dim:S.dim}))}catch(e){}}
async function load(open){try{upd(await api('state',{open}))}catch(e){toast(e.message)}}
async function login(){$('#err').textContent='';const b=$('#login button');b.disabled=true;b.textContent='Signing in…';try{const j=await api('login',{username:$('#u').value,pin:$('#p').value});
  Object.assign(S,{token:j.token,user:j.user,role:j.role});localStorage.setItem('hb',JSON.stringify({token:S.token,user:S.user,role:S.role}));upd(j)}catch(e){$('#err').textContent=e.message}finally{b.disabled=false;b.textContent='Sign in'}}
function logout(){localStorage.removeItem('hb');localStorage.removeItem('hbs');S={tab:'items',items:[],recent:[]};draw()}
function tab(t){S.tab=t;track(t);draw()}
function draw(){
  if(!S.token){$('#login').hidden=false;$('#app').hidden=true;return}
  $('#login').hidden=true;$('#app').hidden=false;
  const tot=S.items.reduce((a,i)=>a+i.budget,0),sp=S.items.reduce((a,i)=>a+i.spent,0);
  const left=m=>S.items.filter(i=>i.mode===m).reduce((a,i)=>a+i.budget-i.spent,0);
  $('#top').innerHTML=`<div class=row><span class=mut>${esc(S.user)} · ${S.month||''}</span><button class=ghost onclick=logout()>Log out</button></div>
  <div class=big>${f(tot-sp)} <small>left of ${f(tot)}</small></div>
  <div class=pills><span>GPay ${f(left('GPay'))}</span><span>Cash ${f(left('Cash'))}</span></div>`;
  $('#tabs').innerHTML=['items','dashboard','recent',...(S.role==='admin'?['admin']:[])].map(t=>`<button class="${S.tab===t?'on':''}" onclick="tab('${t}')">${t}</button>`).join('');
  ({items:vItems,dashboard:vDash,recent:vRecent,admin:vAdmin})[S.tab]()}
const lab=k=>new Date(k+'-01T12:00:00').toLocaleDateString('en-IN',{month:'short',year:'numeric'});
function pickM(k){S.dm=k;vDash()}
function dmGo(d){const ms=S.months||[],j=ms.indexOf(S.dm||S.month)+d;if(j>=0&&j<ms.length)pickM(ms[j])}
async function vDash(){
  const m=S.dm||S.month;S.rep=S.rep||{};
  if(!S.rep[m]){$('#view').innerHTML='<p class=mut>Loading…</p>';try{S.rep[m]=await api('report',{month:m})}catch(e){return toast(e.message)}}
  if(S.tab!=='dashboard'||m!==(S.dm||S.month))return;
  const R=S.rep[m],ms=R.months;S.months=ms.map(x=>x.m);
  const I=R.items,tot=I.reduce((a,i)=>a+i.budget,0),sp=I.reduce((a,i)=>a+i.spent,0),day=R.day||1,dim=R.dim||30;
  const rem=Math.max(1,dim-day+1),per=Math.round(Math.max(0,tot-sp)/rem),proj=Math.round(sp/day*dim),ahead=tot&&sp/tot>day/dim+.05;
  const md=k=>{const x=I.filter(i=>i.mode===k);return[x.reduce((a,i)=>a+i.spent,0),x.reduce((a,i)=>a+i.budget,0)]};
  const bar=(s,b)=>`<div class=bar><i class="${s>b?'bad':''}" style="width:${b?Math.min(100,s/b*100):0}%"></i></div><div style="height:10px"></div>`;
  const watch=I.filter(i=>i.budget&&i.spent/i.budget>=.8).sort((a,b)=>b.spent/b.budget-a.spent/a.budget).slice(0,5);
  const dl=R.daily||{},mx=Math.max(0,...Object.values(dl)),us=Object.entries(R.byUser||{}).sort((a,b)=>b[1]-a[1]),mx2=Math.max(1,...ms.map(x=>x.total));
  $('#view').innerHTML=`<div class=row style="margin:10px 0"><button class=ghost onclick="dmGo(-1)">‹</button><select id=dm onchange="pickM(this.value)" style="margin:0">${ms.slice().reverse().map(x=>`<option value="${x.m}"${x.m===m?' selected':''}>${lab(x.m)}</option>`).join('')}</select><button class=ghost onclick="dmGo(1)">›</button></div>
  <div class=panel><h4>Month by month</h4><div class=days style="height:90px">${ms.map(x=>`<i title="${lab(x.m)}: ${f(x.total)}" onclick="pickM('${x.m}')" style="height:${x.total/mx2*100}%;opacity:${x.m===m?1:.4};cursor:pointer"></i>`).join('')}</div>
  <div class="row mut"><span>${lab(ms[0].m)}</span><span>${lab(m)}: ${f(sp)}</span><span>${lab(ms[ms.length-1].m)}</span></div></div>
  ${R.cur?`<div class=panel><h4>Month pace</h4><div class=row><span>Day ${day} of ${dim}</span><span class="${ahead?'bad':''}">${ahead?'Spending ahead of pace':'On track'}</span></div>
  <div class=mut>Spent ${f(sp)} of ${f(tot)}. At this rate the month ends near ${f(proj)}.</div>
  <div class=big style="font-size:28px;margin:10px 0 0">${f(per)} <small>a day for the next ${rem} days</small></div></div>`
  :`<div class=panel><h4>${lab(m)} summary</h4><div class=big style="font-size:28px;margin:6px 0">${f(sp)} <small>of ${f(tot)} budget</small></div><div class="${sp>tot?'bad':'mut'}">${sp>tot?'Over budget by '+f(sp-tot):f(tot-sp)+' under budget'}</div></div>`}
  <div class=panel><h4>Cash and GPay</h4>${['Cash','GPay'].map(k=>{const[s,b]=md(k);return `<div class=row><span>${k}</span><span class=mut>${f(s)} of ${f(b)}</span></div>${bar(s,b)}`}).join('')}</div>
  <div class=panel><h4>${R.cur?'Running low':'Items near or over limit'}</h4>${watch.map(i=>{const l=i.budget-i.spent;return `<div class=row style="padding:3px 0"><span>${esc(i.item)}</span><span class="${l<0?'bad':''}">${l<0?'over by '+f(-l):f(l)+' left'}</span></div>`}).join('')||'<span class=mut>No item is near its limit.</span>'}</div>
  <div class=panel><h4>Daily spending</h4><div class=days>${Array.from({length:day},(_,k)=>{const v=dl[k+1]||0;return `<i style="height:${mx?v/mx*100:0}%"></i>`}).join('')}</div><div class="row mut"><span>Day 1</span><span>Highest day ${f(mx)}</span><span>Day ${day}</span></div></div>
  <div class=panel><h4>Who spent what</h4>${us.map(([u,v])=>`<div class=row><span>${esc(u)}</span><span class=mut>${f(v)}${sp?' ('+Math.round(v/sp*100)+'%)':''}</span></div>${bar(v,sp)}`).join('')||'<span class=mut>No spending this month.</span>'}</div>`}
function vItems(){$('#view').innerHTML=S.items.map((i,x)=>{const l=i.budget-i.spent,p=Math.min(100,i.budget?i.spent/i.budget*100:0),u=i.budget?Math.round(i.spent/i.budget*100):0,pc=i.spent>0&&u===0?'&lt;1':u;
  return `<div class=it onclick="pick(${x})"><div class=row><span class=name>${esc(i.item)}<span class=tag>${i.mode}</span></span><span class="left ${l<0?'bad':''}">${f(l)}</span></div>
  <div class="row mut"><span>${f(i.spent)} of ${f(i.budget)} (${pc}%)</span><span>${l<0?'over budget':'left'}</span></div><div class=bar><i class="${l<0?'bad':''}" style="width:${p}%"></i></div></div>`}).join('')}
function pick(x){const i=S.sel=S.items[x];$('#sheet').hidden=false;
  $('#sh').innerHTML=`<h3>${esc(i.item)}</h3><div class=mut>${f(i.budget-i.spent)} left</div>
  <input id=amt type=number inputmode=decimal placeholder="Amount in ₹" oninput=pv()><input id=note placeholder="Note (optional)" maxlength=60>
  <div class=mut style="margin-top:6px">Date (change only for a missed entry)</div><input id=dt type=date value="${new Date().toLocaleDateString('en-CA')}" max="${new Date().toLocaleDateString('en-CA')}">
  <div id=pvw class=mut>&nbsp;</div><div class=row><button class=ghost onclick=closeS()>Cancel</button><button id=addb onclick=addExp()>Add expense</button></div>`;$('#amt').focus()}
function pv(){const a=+$('#amt').value||0;$('#pvw').textContent=a?'Left after this: '+f(S.sel.budget-S.sel.spent-a):'\u00a0'}
function closeS(){$('#sheet').hidden=true}
async function addExp(){const a=+$('#amt').value;if(!(a>0))return toast('Enter an amount');const d=$('#dt').value,it=S.sel,note=$('#note').value,cur=!d||d.slice(0,7)===S.month;
  if(cur){it.spent+=a;S.recent.unshift({id:'tmp',item:it.item,amount:a,user:S.user,time:'just now',note});S.daily=S.daily||{};S.daily[S.day]=(S.daily[S.day]||0)+a;S.byUser=S.byUser||{};S.byUser[S.user]=(S.byUser[S.user]||0)+a}
  closeS();draw();toast(cur?'Expense added':'Saved under '+d.slice(0,7)+', not this month');
  queue(()=>api('add',{item:it.item,amount:a,note,date:d})).then(j=>{if(!pend)upd(j)}).catch(e=>{toast(e.message);resync()})}
function vRecent(){
  const g={};S.recent.forEach(r=>(g[r.item]=g[r.item]||[]).push(r));
  S.gk=Object.keys(g);S.open=S.open||{};
  $('#view').innerHTML=S.gk.map((k,x)=>{const L=g[k],o=S.open[k],t=L.reduce((a,r)=>a+r.amount,0);
    return `<button class=hd aria-expanded="${!!o}" onclick="tog(${x})"><span>${o?'▾':'▸'} ${esc(k)}</span><span class=mut>${f(t)} · ${L.length}</span></button>`+
    (o?L.map(r=>`<div class=ent><div class=row><b>${f(r.amount)}</b>${r.user===S.user||S.role==='admin'?`<button class=ghost onclick="del('${r.id}')">Delete</button>`:''}</div><div class=mut>${esc(r.user)} · ${esc(r.time)}${r.note?' · '+esc(r.note):''}</div></div>`).join(''):'')}).join('')||'<p class=mut>No expenses yet this month.</p>'}
function tog(x){const k=S.gk[x];S.open[k]=!S.open[k];vRecent()}
async function del(id){if(id==='tmp')return toast('Still saving, try again in a moment');if(!confirm('Delete this expense?'))return;
  const r=S.recent.find(x=>x.id===id);
  if(r){S.recent=S.recent.filter(x=>x!==r);const it=S.items.find(i=>i.item===r.item);if(it)it.spent-=r.amount;draw()}
  queue(()=>api('del',{id})).then(j=>{if(!pend)upd(j)}).catch(e=>{toast(e.message);resync()})}
async function vAdmin(){
  S.draft=S.draft||S.items.map(i=>({item:i.item,budget:i.budget,mode:i.mode}));
  if(!S.users){try{S.users=(await api('users')).users}catch(e){}}const us=S.users||[];
  const tot=S.draft.reduce((a,d)=>a+(+d.budget||0),0);
  $('#view').innerHTML=`<h3 class=s>Monthly budgets · ${f(tot)}</h3>`+S.draft.map((d,x)=>`<div class=erow><input value="${esc(d.item)}" onchange="S.draft[${x}].item=this.value">
  <input type=number inputmode=numeric value="${d.budget}" onchange="S.draft[${x}].budget=+this.value;vAdmin()"><select onchange="S.draft[${x}].mode=this.value"><option${d.mode=='GPay'?' selected':''}>GPay<option${d.mode=='Cash'?' selected':''}>Cash</select>
  <button class=ghost onclick="S.draft.splice(${x},1);vAdmin()">✕</button></div>`).join('')+
  `<p class=mut>Renaming an item detaches this month's earlier expenses from it.</p><div class=row><button class=ghost onclick="S.draft.push({item:'',budget:0,mode:'GPay'});vAdmin()">+ Add item</button><button onclick=saveB()>Save budgets</button></div>
  <h3 class=s>Family</h3>`+us.map(u=>`<div class=row style="padding:6px 0"><span>${esc(u.username)} <span class=tag>${u.role}</span></span><span><button class=ghost onclick="setU('${u.username}','${u.role}')">Set PIN</button>${u.username===S.user?'':`<button class=ghost onclick="rmU('${u.username}')">Remove</button>`}</span></div>`).join('')+
  `<div class=erow style="grid-template-columns:1fr 80px 90px"><input id=nu placeholder="New username"><input id=np inputmode=numeric placeholder="PIN"><select id=nr><option>member<option>admin</select></div><button onclick=addU() style="width:100%;margin-top:6px">Add user</button>`}
async function saveB(){try{await api('saveBudgets',{items:S.draft});S.draft=null;await load();toast('Budgets saved')}catch(e){toast(e.message)}}
async function setU(u,role){const pin=prompt('New PIN (4-6 digits) for '+u);if(!pin)return;try{await api('setUser',{username:u,pin,role});toast('PIN updated')}catch(e){toast(e.message)}}
async function addU(){try{await api('setUser',{username:$('#nu').value,pin:$('#np').value,role:$('#nr').value});S.users=null;vAdmin()}catch(e){toast(e.message)}}
async function rmU(u){if(!confirm('Remove '+u+'?'))return;try{await api('delUser',{username:u});S.users=null;vAdmin()}catch(e){toast(e.message)}}
draw();if(S.token){track('items');load(true)}
const flush=()=>{if(EVQ.length&&S.token&&!pend)api('ping').catch(()=>{})};
setInterval(flush,20000);document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});
</script></body></html>
